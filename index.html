
<!DOCTYPE html>

    <title>Nirjal's Website</title>

    <style>
        body {
            background-color: #292929;
            font-family: Arial;
            color: white;
            margin: 0;
            background: radial-gradient(
        circle at 20% 20%,
        rgba(212, 175, 55, 0.12),
        transparent 35%
    ),
    #0b0b0b;

background-attachment: fixed;;
        }

        /* Navigation Bar */
        .navbar {
    display: flex;
    justify-content: flex-end;
    padding: 20px 50px;

    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    position: sticky;
    top: 0;
    z-index: 100;
}

        .nav-links a {
            color: #c0c0c0;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        .nav-links a:hover {
    color: #d4af37;
    text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
}

        /* Hero Section */
        .hero {
            text-align: center;
            margin-top: 120px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #c0c0c0);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #aaaaaa;
            letter-spacing: 3px;
        }

        /* Profile Picture */
        .profile-pic {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            border: 3px solid #c0c0c0;
            margin-bottom: 25px;
            object-fit: cover;
        }
        .footer {
    text-align: center;
    margin-top: 150px;
    padding: 30px;
    border-top: 1px solid #444;
}

.footer h2 {
    letter-spacing: 3px;
    font-size: 20px;
}

.footer p {
    color: #aaaaaa;
}

.footer small {
    color: #777777;
}
@media (max-width: 600px) {
    .navbar {
        justify-content: center;
        padding: 20px 10px;
    }

    .nav-links a {
        margin-left: 10px;
        font-size: 13px;
    }

    .hero h1 {
        font-size: 38px;
    }
}
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hero {
    animation: fadeIn 1s ease;
}
.instagram-button {
    display: inline-block;
    background: #E1306C;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s;
    text-align: left;

    position: fixed;
    top: 20px;
    left: 30px;
    z-index: 101;
}

.instagram-button:hover {
    transform: scale(1.08);
    background: #C13584;
}
.instagram-button {
    position: absolute;
    top: 20px;
    left: 30px;
}
