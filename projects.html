
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects | Nirjal</title>

    <style>
        body {
            background-color: #292929;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            background:
    radial-gradient(
        circle at 20% 80%,
        rgba(150, 30, 60, 0.15),
        transparent 40%
    ),
    #0b0b0b;

background-attachment: fixed;
        }

        /* Navigation */
        .navbar {
    display: flex;
    justify-content: flex-end;
    padding: 20px 50px;

    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    position: sticky;
    top: 0;
    z-index: 100;
}

        .nav-links a {
            color: #c0c0c0;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

         .nav-links a:hover {
          color: #d4af37;
          text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
         }
        /* Projects Section */
        .projects {
            text-align: center;
            margin-top: 100px;
        }

        .projects h1 {
            font-size: 45px;
            background: linear-gradient(to right, white, #c0c0c0);
            -webkit-background-clip: text;
            color: transparent;
        }

        .projects > p {
            color: #aaaaaa;
        }

        /* Project Card */
        .project-card {
            background-color: #383838;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #555;
            transition: 0.3s;
        }

        .project-card:hover,
.skill-card:hover {
    transform: translateY(-8px);
    border-color: #d4af37;

    box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
}

        .project-card h2 {
            color: #c0c0c0;
        }

        .project-card p {
            color: #aaaaaa;
            line-height: 1.7;
        }

        /* Project Button */
        .project-link {
    background: linear-gradient(135deg, #d4af37, #f5df91);
    color: #111;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s ease;
}

.project-link:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
}

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 150px;
            padding: 30px;
            border-top: 1px solid #444;
        }

        .footer h2 {
            letter-spacing: 3px;
            font-size: 20px;
        }

        .footer p {
            color: #aaaaaa;
        }

        .footer small {
            color: #777777;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .navbar {
                justify-content: center;
                padding: 20px 10px;
            }

            .nav-links a {
                margin-left: 10px;
                font-size: 13px;
            }

            .projects h1 {
                font-size: 36px;
            }

            .project-card {
                margin: 30px 15px;
            }
        }
        .projects {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.project-link:hover {
    transform: scale(1.08);
}
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>

        <a href="projects.html">Projects</a>
        <a href="skills.html">Skills</a>
      <a href="#" onclick="openContact(event)">Contact</a>
        </div>
    </nav>

    <!-- Projects -->
    <section class="projects">

        <h1>My Projects</h1>

        <p>Some things I've built while learning web development.</p>

        <div class="project-card">

            <h2>Monsoon Restaurant</h2>

            <p>
                A modern restaurant website built using
                HTML, CSS and JavaScript.
            </p>

            <a href="https://monsoon-resturant.pages.dev/"
               target="_blank"
               rel="noopener noreferrer"
               class="project-link">
                View Project
            </a>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
        <h2>NIRJAL DAHAL</h2>
        <p>Learning • Building • Creating</p>
        <small>© 2026 Nirjal Dahal. All rights reserved.</small>
    </footer>

</body>
</html>
