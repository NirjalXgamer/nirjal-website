
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects | Nirjal</title>

    <style>
        body {
            background-color: #292929;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: flex-end;
            padding: 20px 50px;
        }

        .nav-links a {
            color: #c0c0c0;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* Projects Section */
        .projects {
            text-align: center;
            margin-top: 100px;
        }

        .projects h1 {
            font-size: 45px;
            background: linear-gradient(to right, white, #c0c0c0);
            -webkit-background-clip: text;
            color: transparent;
        }

        .projects > p {
            color: #aaaaaa;
        }

        /* Project Card */
        .project-card {
            background-color: #383838;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #555;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: #c0c0c0;
        }

        .project-card h2 {
            color: #c0c0c0;
        }

        .project-card p {
            color: #aaaaaa;
            line-height: 1.7;
        }

        /* Project Button */
        .project-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .project-link:hover {
            background-color: #c0c0c0;
            transform: translateY(-3px);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 150px;
            padding: 30px;
            border-top: 1px solid #444;
        }

        .footer h2 {
            letter-spacing: 3px;
            font-size: 20px;
        }

        .footer p {
            color: #aaaaaa;
        }

        .footer small {
            color: #777777;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .navbar {
                justify-content: center;
                padding: 20px 10px;
            }

            .nav-links a {
                margin-left: 10px;
                font-size: 13px;
            }

            .projects h1 {
                font-size: 36px;
            }

            .project-card {
                margin: 30px 15px;
            }
        }
        .projects {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

            <a href="mailto:nirjalgamer42069@gmail.com">Contact</a>
            <a href="projects.html">Projects</a>
        </div>
    </nav>

    <!-- Projects -->
    <section class="projects">

        <h1>My Projects</h1>

        <p>Some things I've built while learning web development.</p>

        <div class="project-card">

            <h2>Monsoon Restaurant</h2>

            <p>
                A modern restaurant website built using
                HTML, CSS and JavaScript.
            </p>

            <a href="https://monsoon-resturant.pages.dev/"
               target="_blank"
               rel="noopener noreferrer"
               class="project-link">
                View Project
            </a>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
        <h2>NIRJAL DAHAL</h2>

    </footer>

</body>
</html>
